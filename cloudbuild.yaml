# Cloud Build: build Nuxt (API URLs baked in) → push → deploy Cloud Run (web)

substitutions:
  _REGION: australia-southeast1
  _SERVICE: aws-frontend
  _AR_REPO: aws
  _IMAGE_NAME: web
  _API_BASE: https://aws-api-281263231105.australia-southeast1.run.app/api
  _WS_BASE: https://aws-api-281263231105.australia-southeast1.run.app
  _AUTH_DISABLED: 'false'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NUXT_PUBLIC_API_BASE=${_API_BASE}
      - --build-arg
      - NUXT_PUBLIC_WS_BASE=${_WS_BASE}
      - --build-arg
      - NUXT_PUBLIC_AUTH_DISABLED=${_AUTH_DISABLED}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}
    waitFor: ['build']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "${_SERVICE}" \
          --project="${PROJECT_ID}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_IMAGE_NAME}:latest" \
          --region="${_REGION}" \
          --platform=managed \
          --port=8080 \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=10 \
          --timeout=300 \
          --quiet
    waitFor: ['push']

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest
